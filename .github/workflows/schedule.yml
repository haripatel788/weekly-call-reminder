name: Weekly Telegram Bot Reminder

on:
  schedule:
    # Shifted off the 0/15/30 marks to avoid GitHub Action traffic jams!
    - cron: '28 1 * * 2'  # Monday 9:28 PM EDT (Runs at 01:28 UTC Tuesday)
    - cron: '27 0 * * 3'  # Tuesday 8:27 PM EDT (Runs at 00:27 UTC Wednesday)
    - cron: '13 1 * * 3'  # Tuesday 9:13 PM EDT (Runs at 01:13 UTC Wednesday)
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Bot Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python bot.py