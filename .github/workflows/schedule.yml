name: Weekly Telegram Bot Reminder

on:
  schedule:
    # Note: These UTC times currently align with EDT (UTC-4). 
    # When Daylight Saving Time ends in November, they will shift to an hour early and need a quick update.
    - cron: '30 1 * * 2'  # Monday 9:30 PM EDT (Runs at 01:30 UTC Tuesday)
    - cron: '30 0 * * 3'  # Tuesday 8:30 PM EDT (Runs at 00:30 UTC Wednesday)
    - cron: '15 1 * * 3'  # Tuesday 9:15 PM EDT (Runs at 01:15 UTC Wednesday)
  workflow_dispatch:

permissions:
  contents: write  # Crucial: Allows the bot to commit history.json back to the repo

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Bot Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
        run: python bot.py

      - name: Commit and Push History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          # Only commit if history.json actually changed (prevents errors on manual tests)
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update weekly rotation history" && git push)