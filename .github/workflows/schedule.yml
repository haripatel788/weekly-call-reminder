name: Weekly Telegram Bot Reminder

on:
  schedule:
    - cron: '30 1 * * 2'  # Monday 9:30 PM EDT (Runs at 01:30 UTC Tuesday)
    - cron: '30 0 * * 3'  # Tuesday 8:30 PM EDT (Runs at 00:30 UTC Wednesday)
    - cron: '15 1 * * 3'  # Tuesday 9:15 PM EDT (Runs at 01:15 UTC Wednesday)
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Bot Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python bot.py